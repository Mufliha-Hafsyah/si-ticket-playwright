name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Sesuaikan dengan versi PHP Laravel-mu
          coverage: none
          extensions: mbstring, sqlite, pdo_sqlite

      # TAMBAHKAN working-directory: src DI SINI
      - name: Install Composer dependencies
        working-directory: src
        run: composer install --no-progress --prefer-dist --no-interaction

      # TAMBAHKAN working-directory: src DI SINI
      - name: Prepare environment
        working-directory: src
        run: |
          cp .env.example .env || true
          php artisan key:generate --ansi
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force   

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      # TAMBAHKAN working-directory: src DI SINI
      - name: Build Assets
        working-directory: src
        run: |
          npm install
          npm run build

      # TAMBAHKAN working-directory: src DI SINI
      - name: Start Laravel server
        working-directory: src
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000 >/dev/null; then
              echo "Server is up"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done

      - name: Install Playwright dependencies
        working-directory: src/playwright
        run: |
          npm ci
          npx playwright install --with-deps || npx playwright install

      - name: Run Playwright tests
        working-directory: src/playwright
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test --reporter=html

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/playwright/playwright-report